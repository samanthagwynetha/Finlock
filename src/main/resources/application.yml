spring:
  application:
    name: finlock

  datasource:
    url: jdbc:postgresql://localhost:5433/finlock
    username: finlock_user
    password: finlock_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
#        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8080

logging:
  level:
    org.flywaydb: DEBUG