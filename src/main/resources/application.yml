spring:
  application:
    name: finlock

  datasource:
    url: jdbc:postgresql://localhost:5433/finlock
    username: finlock_user
    password: finlock_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
#        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:finlock-super-secret-key-that-is-at-least-32-characters-long}
  expiration: ${JWT_EXPIRATION:86400000}

encryption:
  aes-key: ${AES_KEY:gYI00qX+W10Xr/ProqszHwkZOCVgFLP3u+x4Nm40E9I=}

logging:
  level:
    org.flywaydb: DEBUG

