spring:
  application:
    name: finlock

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/finlock}
    username: ${SPRING_DATASOURCE_USERNAME:finlock_user}
    password: ${SPRING_DATASOURCE_PASSWORD:finlock_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: finlock-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.finlock.finlock.*"
        spring.json.value.default.type: "com.finlock.finlock.transaction.event.TransactionEvent"
      listener:
        ack-mode: batch
server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:finlock-super-secret-key-that-is-at-least-32-characters-long}
  expiration: ${JWT_EXPIRATION:86400000}

encryption:
  aes-key: ${AES_KEY:gYI00qX+W10Xr/ProqszHwkZOCVgFLP3u+x4Nm40E9I=}

logging:
  level:
    org.flywaydb: DEBUG

